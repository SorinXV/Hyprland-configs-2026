

# Base colors (GitHub Dark)
foreground #c9d1d9
background #0d1117

# Cursor
cursor #58a6ff
cursor_text_color #0d1117

# Selection
selection_foreground #c9d1d9
selection_background #1f6feb

# Black
color0 #484f58
color8 #6e7681

# Red
color1 #ff7b72
color9 #ffa198

# Green
color2 #3fb950
color10 #56d364

# Yellow
color3 #d29922
color11 #e3b341

# Blue
color4 #58a6ff
color12 #79c0ff

# Magenta
color5 #bc8cff
color13 #d2a8ff

# Cyan
color6 #39c5cf
color14 #56d4dd

# White
color7 #b1bac4
color15 #f0f6fc

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Adjust cell height so symbols connect seamlessly
adjust_line_height 0
adjust_column_width 0

# Copy on Ctrl+C only if text is selected, otherwise send SIGINT interrupt
map ctrl+c copy_and_clear_or_interrupt

# Paste from clipboard with Ctrl+V
map ctrl+v paste_from_clipboard